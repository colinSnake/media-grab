name: Desktop builds

# GitHub has no commit-message filter for `on.push`; skip jobs before allocating
# runners unless the pushed branch HEAD contains the opt-in marker.
on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  # A skipped, unmarked push must not cancel a running marked/manual build.
  group: desktop-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'build-ci-cd') }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.1'
  PNPM_VERSION: '10.32.0'
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Type checks and tests
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'build-ci-cd') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci-release-tools.mjs check-version
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            bundles: dmg
          - runner: macos-15-intel
            target: darwin-x64
            bundles: dmg
          - runner: windows-2022
            target: win32-x64
            bundles: nsis
          - runner: ubuntu-22.04
            target: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    env:
      MEDIA_GRAB_EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb xauth dbus-x11
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - name: Install Windows media-tool compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make tar diffutils mingw-w64-ucrt-x86_64-gcc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Restore compiled media tools
        id: media-cache
        uses: actions/cache@v4
        with:
          path: .release-tools/${{ matrix.target }}
          key: media-tools-${{ matrix.runner }}-${{ matrix.target }}-${{ hashFiles('scripts/ci-media-tools.json', 'scripts/ci-release-tools.mjs', 'scripts/build-release-ffmpeg.sh') }}
      - name: Download and verify fixed tool sources
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: node scripts/ci-release-tools.mjs download
      - name: Compile FFmpeg on macOS or Linux
        if: steps.media-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: bash scripts/build-release-ffmpeg.sh
      - name: Compile FFmpeg on Windows
        if: steps.media-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-release-ffmpeg.sh
      - name: Create release-tool inputs
        run: node scripts/ci-release-tools.mjs finalize
      - run: pnpm prepare:desktop-runtime
      - run: pnpm prepare:release-tools
      - run: pnpm verify:desktop-runtime
      - name: Build native installers
        run: pnpm --filter @mediagrab/desktop exec tauri build --bundles ${{ matrix.bundles }}
      - name: Remove hidden macOS volume icon file
        if: runner.os == 'macOS'
        run: node scripts/finalize-macos-dmg.mjs
      - name: Smoke-test macOS app bundle
        if: runner.os == 'macOS'
        run: node scripts/smoke-installed-desktop.mjs "$PWD/apps/desktop/src-tauri/target/release/bundle/macos/MediaGrab.app"
      - name: Install and smoke-test Linux deb and AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci-smoke-linux.sh
      - name: Install and smoke-test Windows NSIS package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-smoke-windows.ps1
      - name: Collect installers and checksums
        run: node scripts/ci-release-tools.mjs collect
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30
      - name: Upload media-tool sources and build records
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-${{ matrix.target }}-tool-sources
          path: |
            .release-tools/${{ matrix.target }}/sources/
            .release-tools/${{ matrix.target }}/build-records/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MediaGrab-${{ matrix.target }}-diagnostics
          path: |
            .release-tools/${{ matrix.target }}/build-records/
            apps/desktop/src-tauri/resources/core/runtime.json
            ${{ runner.temp }}/mediagrab-installed-smoke-*/**/core.log
            apps/desktop/src-tauri/resources/media-tools/${{ matrix.target }}/tools-manifest.json
          if-no-files-found: ignore
          retention-days: 7
