[package]
name = "mediagrab-desktop"
version = "0.1.0"
description = "MediaGrab desktop shell"
authors = ["mediaGrab"]
license = "MIT"
edition = "2021"

[lib]
name = "mediagrab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
libc = "0.2"
