[package]
name = "mediagrab-desktop"
version = "0.1.1"
description = "MediaGrab desktop shell"
authors = ["mediaGrab"]
license = "MIT"
edition = "2021"

[lib]
name = "mediagrab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
libc = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
getrandom = "0.3"
sha2 = "0.10"
hmac = "0.12"
